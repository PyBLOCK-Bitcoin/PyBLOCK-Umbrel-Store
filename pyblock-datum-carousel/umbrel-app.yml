manifestVersion: 1.1
id: pyblock-datum-carousel
category: bitcoin
name: CAROUSEL
version: "v1.0.0"
icon: https://b.pyblock.xyz:8443/assets/umbrel/pyblock-datum-carousel.svg
tagline: PyBLOCK Crew CAROUSEL, Port 23338
description: >-
  ⚙️ PyBLOCK CAROUSEL, Port 23338

  You keep 99%, 1% PyBLOCK.

  In order for DATUM to be fully initialized, you need to add your Bitcoin XBT address in the "Config" tab within the DATUM app.
  This is the default address that mining rewards will be sent to. Your in-app credentials needed to change settings can be found by
  right-clicking on the DATUM app icon from your umbrelOS homescreen and selecting "Show default credentials".
  
  Use your umbrelOS device’s IP address (found in Settings on the umbrelOS home screen) and port 23338.
  e.g., stratum+tcp://192.168.4.56:23338

developer: PyBLOCK Crew
website: https://b.pyblock.xyz:8443
dependencies:
  - bitcoin
repo: https://b.pyblock.xyz:8443
support: https://t.me/pyblockpool
port: 21008
gallery:
  - https://b.pyblock.xyz:8443/assets/umbrel/gallery/carousel/1.jpg
  - https://b.pyblock.xyz:8443/assets/umbrel/gallery/carousel/2.jpg
  - https://b.pyblock.xyz:8443/assets/umbrel/gallery/carousel/3.jpg
path: ""
defaultUsername: "admin"
deterministicPassword: true
releaseNotes: >-
  PyBLOCK Crew Carousel
widgets:
  - id: "stats"
    type: "three-stats"
    refresh: "30s"
    endpoint: "datum:21009/umbrel-api"
    link: ""
    example:
      type: "three-stats"
      link: ""
      items:
        - title: "Connections"
          text: "12"
          subtext: "Worker"
        - title: "Hashrate"
          text: "21"
          subtext: "TH/s"
submitter: PyBLOCK Crew
submission: https://t.me/pyblockpool
