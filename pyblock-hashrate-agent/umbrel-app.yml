releaseNotes: >-
  0.4.3: new pages. The Rent tab shows a live chart of the hashrate your own meter measured, against what the rig advertises and the minimum that keeps the payments going, with what you paid, the time left and the next payment. The Status tab now shows your rig's hashrate over the last 24 hours, with the rented periods shaded, what you earned and the running rental. The first setup is a step-by-step wizard. From this version on, the app tells you when a newer version is out: the notice is signed by PyBLØCK and read from your own relays.
