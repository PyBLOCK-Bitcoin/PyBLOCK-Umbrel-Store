version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: pyblock-terminal_web_1
      APP_PORT: 6969
      # Umbrel's login stays in front: the web terminal has no password of its own

  web:
    image: registry.gitlab.com/astrolexis-group1/pyblock/terminal:5.2.1@sha256:5fd831fbd89fd75087186ff3b79328369fc52ce3155840c70a2a855bec018377
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 10s
    volumes:
      - ${APP_DATA_DIR}/data/config:/app/pyblock/pybitblock/config
    environment:
      # The node RPC from PATUM (Knots) or PATUM (Plumb); rewritten into the config on every start
      BITCOIN_RPC_HOST: ${APP_BITCOIN_NODE_IP}
      BITCOIN_RPC_PORT: ${APP_BITCOIN_RPC_PORT}
      BITCOIN_RPC_USER: ${APP_BITCOIN_RPC_USER}
      BITCOIN_RPC_PASS: ${APP_BITCOIN_RPC_PASS}
      PYBLOCK_PORT: "6969"
