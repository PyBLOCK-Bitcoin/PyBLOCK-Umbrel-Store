      link: ""
      items:
        - title: "Connections"
          text: "12"
          subtext: "Worker"
        - title: "Hashrate"
          text: "21"
          subtext: "TH/s"
submitter: PyBLOCK Crew
submission: https://t.me/pyblockpool
