manifestVersion: 1.1
id: pyblock-hashrate-agent
category: bitcoin
name: PyBLØCK Hashrate Agent
version: "0.4.3"
tagline: Rent out your BLAKE2b rig on Nostr, or rent hashrate, paid per tranche in Lightning XBT
icon: https://b.pyblock.xyz:8443/assets/umbrel/pyblock-hashrate-agent.svg
description: >-
  The PyBLØCK hashrate market on Nostr (P2Hash). Rent out your BLAKE2b rig, rent other people's rigs, or both,
  peer to peer, with no marketplace holding the money.


  Point your rig at your Umbrel on port 23350. When nobody rents it, the agent sends it to your own pool. It
  publishes a signed listing of the rig on Nostr with a BOLT12 offer from your Laguz wallet. A buyer pays each
  tranche in advance, and the hash only goes to the buyer's DATUM gateway after the payment is settled in your
  wallet. If a tranche is not paid in time, the rig comes back home.


  Open the app and fill in the settings: a receive-only wallet CONNECTION from Laguz (Connections → new app with
  get_info, make_invoice, lookup_invoice and list_transactions, budget 0; not your BOLT12 offer), your home pool,
  your rig's hashrate, price and tranche (the form shows what a buyer pays per tranche, hour and day), and a
  settings password. The status page stays read-only. For a PyBLØCK pool app on this Umbrel, use its container as the home pool
  (for example pyblock-datum-chirp_datum_1, port 23341, with your address as the user).


  Rent tab (optional): turn on "Rent hashrate" in the settings. You need a SEPARATE Laguz wallet connection that can
  pay, with a budget; your DATUM gateway; caps per rental and per 24 h; and port 23351 forwarded on your router to
  this Umbrel (sellers' rigs send the hash there). The agent pays each tranche only while it measures the hash on
  your gateway, so you risk one tranche at most.


  Back up the data folder: it holds your identities (nostr.key, nostr-buyer.key).


  Source: https://gitlab.com/astrolexis-group1/pyblock-hashrate-agent
