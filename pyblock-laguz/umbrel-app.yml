manifestVersion: 1.1
id: pyblock-laguz
category: bitcoin
name: Laguz
version: "0.1.14"
tagline: PyBLOCK Crew XBT Lightning Node Blake2b
icon: https://b.pyblock.xyz:8443/assets/umbrel/pyblock-laguz.svg
description: >-
  ᛚ Laguz is a self-custodial Lightning hub for XBT (Bitcoin BLAKE2b), built by PyBLØCK.

  It runs an LND node (lightning-fork, BLAKE2b) on top of your PATUM (Knots) or PATUM (Plumb) and a web dashboard to open
  channels, send and receive, and connect the PyBLØCK app with one tap over Nostr Wallet Connect.

  Your node, your keys, your channels. No accounts, no custodian.

  Requires PATUM (Knots) or PATUM (Plumb), fully synced.
  To accept inbound channels from other nodes, forward (router) 9935 -> (device) 9935.

  Important: fund channels only with XBT coins received after the chain split (coins mined or received
  on XBT). Coins from before the split also exist on Bitcoin and could be replayed there.

  Laguz is a fork of Alby Hub (Apache-2.0). Source: https://gitlab.com/astrolexis-group1/laguz
developer: PyBLOCK Crew
website: https://b.pyblock.xyz:8443/laguz.php
dependencies:
  - pyblock-bitcoinknots
repo: https://gitlab.com/astrolexis-group1/laguz
support: https://t.me/pyblockpool
port: 2177
gallery:
  - https://b.pyblock.xyz:8443/assets/umbrel/gallery/laguz/1.jpg
  - https://b.pyblock.xyz:8443/assets/umbrel/gallery/laguz/2.jpg
  - https://b.pyblock.xyz:8443/assets/umbrel/gallery/laguz/3.jpg
path: ""
defaultPassword: ""
releaseNotes: >-
  Transaction links now open in a block explorer your browser can reach (mempool.guide by default). Before,
  "view transaction" pointed at the app's internal chain service and the page could not load. Your wallet
  still asks only your own node for its data; the explorer only sees a transaction when you open its link.
  To use your own mempool app instead, set LAGUZ_EXPLORER_URL in the app's docker-compose.yml.
  Same channels, same data, same 24-word recovery phrase: nothing to do.
