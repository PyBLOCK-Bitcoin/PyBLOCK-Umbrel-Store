manifestVersion: 1.1
id: pyblock-plumb
implements:
  - bitcoin
  - pyblock-bitcoinknots
storage:
  dataRoot: data
category: bitcoin
name: PATUM (Plumb)
version: "29.5.1.knots20260508.plumb15"
tagline: PyBLOCK Crew XBT PATUM Plumb Node Blake2b
description: >-
  Plumb is Bitcoin Knots plus the spam filters its maintainers have reviewed,
  each on by default and each its own setting. It follows Bitcoin, which has
  used BLAKE2b proof of work since block 961640. The filters change what your
  node relays and mines, not which blocks are valid.


  This app is Leo Haf's Bitcoin Knots app for Umbrel with the signed Plumb
  release inside and optimized by PyBLOCK Crew.


  It runs beside the Bitcoin Node and Bitcoin Knots apps, on its own ports:
  P2P 10333 and RPC 10332. The first start downloads and checks the whole
  chain.


  To forward incoming peer traffic to your device: (router) 10333 -> (device) 10333.


  Install steps and troubleshooting: https://plumbnode.org/umbrel/
developer: Jason Sopko
website: https://plumbnode.org
dependencies: []
repo: https://github.com/plumb-node/umbrel-plumb
support: https://github.com/plumb-node/plumb/issues
port: 2114
icon: https://b.pyblock.xyz:8443/assets/umbrel/pyblock-patum.svg
gallery:
  - https://b.pyblock.xyz:8443/assets/umbrel/gallery/patum/1.jpg
  - https://b.pyblock.xyz:8443/assets/umbrel/gallery/patum/2.jpg
  - https://b.pyblock.xyz:8443/assets/umbrel/gallery/patum/3.jpg
path: ""
defaultPassword: ""
releaseNotes: >-
  Plumb 15, the signed release by Jason Sopko, now on Bitcoin Knots 29.5.1: fixes CVE-2026-117348 (a peer could
  stall the node with orphan transactions) and makes the spam filters stricter (keys count toward the datacarrier
  limit unless a signature is verified against them; script reuse inside a package is rejected). Plumb 15 also fixes
  -rejectunverifiedwitness, which counted a signature-sized push as a proven key and let data past -datacarriersize.
  The BLAKE2b fork rules are now separate flags and the annex stays banned on every input; no block since the fork
  uses one, so the node keeps its chain. User agent now /Satoshi:29.5.1/Knots:20260508/PATUM:1.0.7(...)/Plumb:15/.
  Same data and settings: nothing else to do.
widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "5s"
    endpoint: "app:3000/api/widget/stats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Connections"
          text: "11"
          subtext: "peers"
        - title: "Mempool"
          text: "257"
          subtext: "MB"
        - title: "Hashrate"
          text: "590"
          subtext: "EH/s"
        - title: "Blockchain size"
          text: "600"
          subtext: "GB"
  - id: "sync"
    type: "text-with-progress"
    refresh: "2s"
    endpoint: "app:3000/api/widget/sync"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "Blockchain sync"
      text: "83%"
      progressLabel: "In progress"
      progress: 0.83
backupIgnore:
  - data/bitcoin/blocks
  - data/bitcoin/chainstate
  - data/bitcoin/indexes
  - data/bitcoin/testnet3/blocks
  - data/bitcoin/testnet3/chainstate
  - data/bitcoin/testnet3/indexes
  - data/bitcoin/testnet4/blocks
  - data/bitcoin/testnet4/chainstate
  - data/bitcoin/testnet4/indexes
  - data/bitcoin/signet/blocks
  - data/bitcoin/signet/chainstate
  - data/bitcoin/signet/indexes
  - data/bitcoin/regtest/blocks
  - data/bitcoin/regtest/chainstate
  - data/bitcoin/regtest/indexes
submitter: Jason Sopko
submission: https://github.com/plumb-node/umbrel-plumb
