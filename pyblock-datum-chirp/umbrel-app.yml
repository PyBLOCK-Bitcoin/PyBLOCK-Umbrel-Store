manifestVersion: 1.1
id: pyblock-datum-chirp
category: bitcoin
name: CHIRP
version: "v1.2.0"
icon: https://b.pyblock.xyz:8443/assets/umbrel/pyblock-datum-chirp.svg
tagline: PyBLOCK Crew CHIRP, Port 23341
description: >-
  ⚙️ PyBLOCK CHIRP, Port 23341

  Pooled Mode, 0% PyBLOCK.

  In order for DATUM to be fully initialized, you need to add your Bitcoin XBT address in the "Config" tab within the DATUM app.
  This is the default address that mining rewards will be sent to. Your in-app credentials needed to change settings can be found by
  right-clicking on the DATUM app icon from your umbrelOS homescreen and selecting "Show default credentials".
  
  Use your umbrelOS device’s IP address (found in Settings on the umbrelOS home screen) and port 23341.
  e.g., stratum+tcp://192.168.4.56:23341

developer: PyBLOCK Crew
website: https://b.pyblock.xyz:8443
dependencies:
  - pyblock-bitcoinknots
repo: https://b.pyblock.xyz:8443
support: https://t.me/pyblockpool
port: 21011
gallery:
  - https://b.pyblock.xyz:8443/assets/umbrel/gallery/chirp/1.jpg
  - https://b.pyblock.xyz:8443/assets/umbrel/gallery/chirp/2.jpg
  - https://b.pyblock.xyz:8443/assets/umbrel/gallery/chirp/3.jpg
path: ""
defaultUsername: "admin"
deterministicPassword: true
releaseNotes: >-
  CHIRP moves to its own ports so it can run next to other Umbrel DATUM apps: miners now connect to port 23341 (was 23339) and the web page is on 21011 (was 21009). Point your miners to the new port after updating. Your payout address and settings are kept. DATUM Gateway v0.5.0beta (CONVOY 69c61a9). The install popup now only offers PyBLOCK nodes (PATUM (Knots) or PATUM (Plumb)); if Umbrel asks which node to use after updating, pick yours.
widgets:
  - id: "stats"
    type: "three-stats"
    refresh: "30s"
    endpoint: "datum:21011/umbrel-api"
    link: ""
    example:
      type: "three-stats"
      link: ""
      items:
        - title: "Connections"
          text: "12"
          subtext: "Worker"
        - title: "Hashrate"
          text: "21"
          subtext: "TH/s"
submitter: PyBLOCK Crew
submission: https://t.me/pyblockpool
