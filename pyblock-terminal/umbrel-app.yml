releaseNotes: >-
  PyBLØCK 5.2.3: the YOUR NODE panel checks that it is talking to a BLAKE2b node, even while the node is still syncing, and tells you if it is pointed at the wrong node. The Setup node test checks it too, and the bitcoin-cli command may carry arguments (for example -datadir).
