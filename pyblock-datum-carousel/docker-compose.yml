version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: pyblock-datum-carousel_datum_1
      APP_PORT: 21008

  datum:
    image: registry.gitlab.com/astrolexis-group1/pyblock-umbrel-store/datum-convoy:v0.5.0beta-69c61a9@sha256:bfdafe66882862dc3351fc82913675bab1698e5325d8e016b00ad250473c3bb6
    entrypoint: ["/app/datum_gateway"]
    command: ["--config=/app/conf/datum_gateway_config.json"]
    user: 1000:1000
    restart: on-failure
    # Match Debian's DATUM Gateway systemd service (LimitNOFILE=65535).
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ${APP_DATA_DIR}/data/settings/:/app/conf/
    ports:
      # datum gateway port
      - 23338:23338
