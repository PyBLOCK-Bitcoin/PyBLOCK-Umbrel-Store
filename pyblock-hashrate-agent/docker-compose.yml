version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: pyblock-hashrate-agent_web_1
      APP_PORT: 8080
      # Umbrel's login stays in front: the settings page has no password of its own

  web:
    image: registry.gitlab.com/astrolexis-group1/pyblock-hashrate-agent/agent:0.4.4@sha256:1e43b6f0c3ab6b58e1f159c6cfe5b0f125bdadd95c1c58e1bc543d1e4a2d0e6d
    user: "1000:1000"
    init: true
    # settings saved from the page → the agent exits (code 3) and comes back with them
    restart: on-failure
    stop_grace_period: 15s
    volumes:
      - ${APP_DATA_DIR}/data:/data
    ports:
      # stratum for your rigs: point them at <umbrel-ip>:23350
      - 23350:3333
      # Rent tab only: the meter, where sellers' rigs send the hash you rent. Forward 23351 on your router to use Rent.
      - 23351:3334
    environment:
      PB_AGENT_DIR: /data
      PB_STATUS_BIND: "0.0.0.0"
      PB_STATUS_PORT: "8080"
      PB_PUBLIC_PORT_HINT: "23351"
      # which update instructions the new-version notice shows
      PB_PLATFORM: "umbrel"
