manifestVersion: 1.1
id: pyblock-bitcoinknots
category: bitcoin
name: PATUM Node
implements:
  - bitcoin
version: "1.0.4"
tagline: PyBLOCK Crew XBT PATUM Node Blake2b
icon: https://b.pyblock.xyz:8443/assets/umbrel/pyblock-patum.svg
description: >-
  PyBLOCK PATUM Node.

  By default, PyBLOCK uses a Node policy that aligns with our principles: 0 SPAM.

  The matching switches in Settings won't override it.

  To forward incoming peer traffic to your device, set up the following configuration: (router) 9333 -> (device) 9333.

  Powered by PyBLOCK Crew and Bitcoin Knots: https://b.pyblock.xyz:8443 https://bitcoinknots.org/
developer: PyBLOCK Crew
website: https://b.pyblock.xyz:8443
dependencies: []
repo: https://github.com/PyBLOCK-Bitcoin/PyBLOCK-Umbrel-Store/
support: https://t.me/pyblockpool
port: 2113
gallery:
  - https://b.pyblock.xyz:8443/assets/umbrel/gallery/patum/1.jpg
  - https://b.pyblock.xyz:8443/assets/umbrel/gallery/patum/2.jpg
  - https://b.pyblock.xyz:8443/assets/umbrel/gallery/patum/3.jpg
path: ""
defaultPassword: ""
releaseNotes: >-
  Required update before block 979,919: Bitcoin Knots 29.4.3 (final). From block 979,919 each new coinbase
  matures on its own after 25,920 blocks (~180 days); coinbases mined between 973,440 and 979,918 still unlock
  at block 979,920. A node still on 29.4.2 would follow a different rule after that block, so update now.
  Knots has not published 29.4.3 binaries yet, so PyBLOCK built them from Luke Dashjr's signed v29.4.3 tag
  (tests, symbol and security checks passed). Same data and settings: nothing else to do.
widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "5s"
    endpoint: "app:3000/api/widget/stats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Connections"
          text: "11"
          subtext: "peers"
        - title: "Mempool"
          text: "257"
          subtext: "MB"
        - title: "Hashrate"
          text: "590"
          subtext: "EH/s"
        - title: "Blockchain size"
          text: "900"
          subtext: "GB"
  - id: "sync"
    type: "text-with-progress"
    refresh: "2s"
    endpoint: "app:3000/api/widget/sync"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "Blockchain sync"
      text: "83%"
      progressLabel: "In progress"
      progress: 0.83
backupIgnore:
  - data/bitcoin/blocks
  - data/bitcoin/chainstate
  - data/bitcoin/indexes
  - data/bitcoin/testnet3/blocks
  - data/bitcoin/testnet3/chainstate
  - data/bitcoin/testnet3/indexes
  - data/bitcoin/testnet4/blocks
  - data/bitcoin/testnet4/chainstate
  - data/bitcoin/testnet4/indexes
  - data/bitcoin/signet/blocks
  - data/bitcoin/signet/chainstate
  - data/bitcoin/signet/indexes
  - data/bitcoin/regtest/blocks
  - data/bitcoin/regtest/chainstate
  - data/bitcoin/regtest/indexes
submitter: PyBLOCK Crew
submission: https://t.me/pyblockpool
