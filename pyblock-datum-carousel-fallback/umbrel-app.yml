manifestVersion: 1.1
id: pyblock-datum-carousel-fallback
category: bitcoin
name: CAROUSEL Fallback
version: "v1.0.0"
icon: https://b.pyblock.xyz:8443/assets/umbrel/pyblock-datum-carousel.svg
tagline: PyBLOCK Crew CAROUSEL Fallback, Port 23343
description: >-
  ⚙️ PyBLOCK CAROUSEL Fallback, Port 23343

  Lotto Mode, 99% You, 1% PyBLOCK.

  A second CAROUSEL gateway on its own ports, so you can mine through two nodes and keep going if one of them stops.

  Install PATUM (Knots) and PATUM (Plumb). CAROUSEL uses PATUM (Knots) and CAROUSEL Fallback uses PATUM (Plumb); with only one of them
  installed, both gateways use that one. Point your miners at both ports: the one you list first is your main pool and
  the other your fallback (either way round).

  CAROUSEL: stratum+tcp://<your umbrelOS IP>:23338
  CAROUSEL Fallback: stratum+tcp://<your umbrelOS IP>:23343

  In order for DATUM to be fully initialized, you need to add your Bitcoin XBT address in the "Config" tab within the DATUM app.
  Your in-app credentials can be found by right-clicking on the app icon on your umbrelOS homescreen and selecting "Show default credentials".

developer: PyBLOCK Crew
website: https://b.pyblock.xyz:8443
dependencies:
  - pyblock-bitcoinknots
repo: https://b.pyblock.xyz:8443
support: https://t.me/pyblockpool
port: 21013
gallery:
  - https://b.pyblock.xyz:8443/assets/umbrel/gallery/carousel/1.jpg
  - https://b.pyblock.xyz:8443/assets/umbrel/gallery/carousel/2.jpg
  - https://b.pyblock.xyz:8443/assets/umbrel/gallery/carousel/3.jpg
path: ""
defaultUsername: "admin"
deterministicPassword: true
releaseNotes: >-
  First version: a second CAROUSEL gateway on port 23343 (web 21013) that prefers PATUM (Plumb), for a main + fallback setup with two nodes.
