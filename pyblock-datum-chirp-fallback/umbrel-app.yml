manifestVersion: 1.1
id: pyblock-datum-chirp-fallback
category: bitcoin
name: CHIRP Fallback
version: "v1.0.0"
icon: https://b.pyblock.xyz:8443/assets/umbrel/pyblock-datum-chirp.svg
tagline: PyBLOCK Crew CHIRP Fallback, Port 23344
description: >-
  ⚙️ PyBLOCK CHIRP Fallback, Port 23344

  Pooled Mode, 0% PyBLOCK.

  A second CHIRP gateway on its own ports, so you can mine through two nodes and keep going if one of them stops.

  Install PATUM (Knots) and PATUM (Plumb). CHIRP uses PATUM (Knots) and CHIRP Fallback uses PATUM (Plumb); with only one of them
  installed, both gateways use that one. Point your miners at both ports: the one you list first is your main pool and
  the other your fallback (either way round).

  CHIRP: stratum+tcp://<your umbrelOS IP>:23341
  CHIRP Fallback: stratum+tcp://<your umbrelOS IP>:23344

  In order for DATUM to be fully initialized, you need to add your Bitcoin XBT address in the "Config" tab within the DATUM app.
  Your in-app credentials can be found by right-clicking on the app icon on your umbrelOS homescreen and selecting "Show default credentials".

developer: PyBLOCK Crew
website: https://b.pyblock.xyz:8443
dependencies:
  - pyblock-bitcoinknots
repo: https://b.pyblock.xyz:8443
support: https://t.me/pyblockpool
port: 21014
gallery:
  - https://b.pyblock.xyz:8443/assets/umbrel/gallery/chirp/1.jpg
  - https://b.pyblock.xyz:8443/assets/umbrel/gallery/chirp/2.jpg
  - https://b.pyblock.xyz:8443/assets/umbrel/gallery/chirp/3.jpg
path: ""
defaultUsername: "admin"
deterministicPassword: true
releaseNotes: >-
  First version: a second CHIRP gateway on port 23344 (web 21014) that prefers PATUM (Plumb), for a main + fallback setup with two nodes.
widgets:
