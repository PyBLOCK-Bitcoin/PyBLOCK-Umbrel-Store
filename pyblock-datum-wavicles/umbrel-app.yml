manifestVersion: 1.1
id: pyblock-datum-wavicles
category: bitcoin
name: WAVICLES
version: "v1.1.0"
icon: https://b.pyblock.xyz:8443/assets/umbrel/pyblock-datum-wavicles.svg
tagline: PyBLOCK Crew WAVICLES, Port 23340
description: >-
  ⚙️ PyBLOCK WAVICLES, Port 23340

  Pooled Mode, 0% PyBLOCK.

  In order for DATUM to be fully initialized, you need to add your Bitcoin XBT address in the "Config" tab within the DATUM app.
  This is the default address that mining rewards will be sent to. Your in-app credentials needed to change settings can be found by
  right-clicking on the DATUM app icon from your umbrelOS homescreen and selecting "Show default credentials".
  
  Use your umbrelOS device’s IP address (found in Settings on the umbrelOS home screen) and port 23340.
  e.g., stratum+tcp://192.168.4.56:23340

developer: PyBLOCK Crew
website: https://b.pyblock.xyz:8443
dependencies:
  - bitcoin
repo: https://b.pyblock.xyz:8443
support: https://t.me/pyblockpool
port: 21010
gallery:
  - https://b.pyblock.xyz:8443/assets/umbrel/gallery/wavicles/1.jpg
  - https://b.pyblock.xyz:8443/assets/umbrel/gallery/wavicles/2.jpg
  - https://b.pyblock.xyz:8443/assets/umbrel/gallery/wavicles/3.jpg
path: ""
defaultUsername: "admin"
deterministicPassword: true
releaseNotes: >-
  DATUM Gateway v0.5.0beta (CONVOY), built by PyBLOCK from the pinned commit 69c61a9: the same gateway the PyBLOCK pools and PATUM run. It includes the BLAKE2b coinbase weight fix, reports block-submission failures correctly and tracks local and pool shares separately. Hasher time rolling is now off by default. The gateway settings page now asks for the password (umbrel) to view the settings too, not only to save them.
widgets:
  - id: "stats"
    type: "three-stats"
    refresh: "30s"
    endpoint: "datum:21010/umbrel-api"
    link: ""
    example:
      type: "three-stats"
      link: ""
      items:
        - title: "Connections"
          text: "12"
          subtext: "Worker"
        - title: "Hashrate"
          text: "21"
          subtext: "TH/s"
submitter: PyBLOCK Crew
submission: https://t.me/pyblockpool
